name: CI

# CI: jalan otomatis setiap push ke main dan setiap pull request
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependency
        run: pip install -r requirements-dev.txt

      - name: Lint (flake8)
        run: flake8 . --max-line-length=100

      - name: Test (pytest)
        run: pytest -v

      - name: Peringatan jika gagal
        if: failure()
        run: |
          echo "::error title=CI GAGAL::Commit ini tidak aman. Lakukan rollback: git revert <sha> lalu git push"
          echo "### CI GAGAL - lakukan rollback (git revert) sebelum rilis" >> "$GITHUB_STEP_SUMMARY"
